name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5433/student_knowledge_hub_test
      DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5433/student_knowledge_hub_test
      APP_ENV: testing
      JWT_SECRET_KEY: test-secret
      INTERNAL_AUTH_SECRET: test-internal-secret
      REDIS_URL: ""
      MAIL_ENABLED: "false"
      MAIL_API_TOKEN: ""
      RATE_LIMIT_IN_MEMORY_FALLBACK: "true"
      TELEGRAM_EVENT_PUSH_ENABLED: "false"
      TELEGRAM_BOT_USERNAME: bilimhub_bot
      BOT_SERVICE_NAME: telegram-bot
      BACKEND_SERVICE_NAME: backend-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Alembic head
        run: alembic heads

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          slug: ShodmonX/student-knowledge-hub
          fail_ci_if_error: true
