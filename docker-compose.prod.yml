services:
  api:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "false"
      STORAGE_ROOT: /home/appuser/storage
      BACKUP_LOCAL_ROOT: /home/appuser/backups
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - storage_data:/home/appuser/storage
      - backups_data:/home/appuser/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backup:
    build: .
    command: python scripts/backup_worker.py
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      RUN_MIGRATIONS_ON_START: "false"
      RUN_SEED_ON_START: "false"
      REDIS_URL: redis://redis:6379/0
      BACKUP_SCHEDULE_ENABLED: "true"
      BACKUP_LOCAL_ROOT: /home/appuser/backups
    restart: unless-stopped
    volumes:
      - backups_data:/home/appuser/backups
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: student_knowledge_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_knowledge_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  storage_data:
  backups_data:
