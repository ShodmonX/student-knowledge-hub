services:
  api:
    build: .
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${APP_WORKERS}"]
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      APP_ENV: production
      DEBUG: "false"
      RUN_SEED_ON_START: "true"
      STORAGE_ROOT: /home/appuser/storage
      BACKUP_LOCAL_ROOT: /home/appuser/backups
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - storage_data:/home/appuser/storage
      - backups_data:/home/appuser/backups
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - web

  backup:
    build: .
    command: python scripts/backup_worker.py
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      RUN_MIGRATIONS_ON_START: "false"
      RUN_SEED_ON_START: "false"
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      BACKUP_SCHEDULE_ENABLED: "true"
      BACKUP_LOCAL_ROOT: /home/appuser/backups
    restart: unless-stopped
    volumes:
      - backups_data:/home/appuser/backups
    depends_on:
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  email-worker:
    build: .
    command: python scripts/email_worker.py
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      RUN_MIGRATIONS_ON_START: "false"
      RUN_SEED_ON_START: "false"
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  telegram-worker:
    build: .
    command: python scripts/telegram_event_worker.py
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      RUN_MIGRATIONS_ON_START: "false"
      RUN_SEED_ON_START: "false"
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - web
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
  storage_data:
  backups_data:

networks:
  web:
    external: true

