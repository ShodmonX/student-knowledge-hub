services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://:dev-redis-password@redis:6379/0}
      STORAGE_ROOT: /home/appuser/storage
      BACKUP_LOCAL_ROOT: /home/appuser/backups
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./storage:/home/appuser/storage
      - backups_data:/home/appuser/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - default
      - web

  backup:
    build: .
    command: python scripts/backup_worker.py
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS_ON_START: "false"
      RUN_SEED_ON_START: "false"
      REDIS_URL: ${REDIS_URL:-redis://:dev-redis-password@redis:6379/0}
      BACKUP_LOCAL_ROOT: /home/appuser/backups
    volumes:
      - .:/app
      - backups_data:/home/appuser/backups
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  email-worker:
    build: .
    command: python scripts/email_worker.py
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS_ON_START: "false"
      RUN_SEED_ON_START: "false"
      REDIS_URL: ${REDIS_URL:-redis://:dev-redis-password@redis:6379/0}
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  telegram-worker:
    build: .
    command: python scripts/telegram_event_worker.py
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS_ON_START: "false"
      RUN_SEED_ON_START: "false"
      REDIS_URL: ${REDIS_URL:-redis://:dev-redis-password@redis:6379/0}
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - web

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_knowledge_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  backups_data:

networks:
  web:
    external: true
