# Sample nginx config for the external nginx container.
# The nginx container must join the same external Docker network as the API service.

upstream student_knowledge_hub_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name example.com;

    # In production, terminate TLS here or redirect to an HTTPS server block.
    # return 301 https://$host$request_uri;

    client_max_body_size 60m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://student_knowledge_hub_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

