[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-knowledge-hub"
version = "0.1.0"
description = "Backend API for Student Knowledge Hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "asyncpg>=0.30.0",
  "boto3>=1.37.0",
  "botocore>=1.37.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "httpx>=0.28.1",
  "passlib>=1.7.4",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.20",
  "pypdf>=5.4.0",
  "redis[hiredis]>=5.2.1",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
